; Publisher — a sidecar plugin on the Sidecar Kit (copy of config.example.ini; gitignored).
; Owns WHERE and HOW a project publishes. Deliberately NOT part of an instance's repo: a
; finished application does not ship its own deployment tooling.

[app]
name = "Publisher"
baseurl = "https://publisher.tiknix.com"
session_name = "PUBLISHER_SESSION"
debug = false
builder_tools_enabled = false

[database]
type = "sqlite"
path = "data/publisher.db"

[sidecar]
name       = "publisher"
feature    = "publisher"
landing    = "/publish"
core_root  = "/var/www/html/default/tiknix"
core_url   = "https://tiknix.com"
sso_secret = ""
